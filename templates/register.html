<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我要报名 - 普通人 AI 交流会</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a class="brand" href="{{ url_for('index') }}">AI Meetup Kit</a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}">首页</a>
                <a href="{{ url_for('agenda') }}">活动议程</a>
                <a href="{{ url_for('register') }}">我要报名</a>
                <a href="{{ url_for('codex') }}">Codex 教学</a>
            </div>
        </nav>
    </header>

    <main class="page">
        <section class="section narrow">
            <p class="eyebrow">Register</p>
            <h1>我要报名</h1>
            <p class="lead">当前页面先提供 GET 展示，后续 Backend Agent 可以继续实现表单提交和保存。</p>

            <form class="form" method="get">
                <label>
                    姓名
                    <input type="text" name="name" placeholder="请输入姓名">
                </label>
                <label>
                    联系方式
                    <input type="text" name="contact" placeholder="手机号或微信">
                </label>
                <label>
                    你想用 AI 解决什么问题
                    <textarea name="question" rows="5" placeholder="例如：整理客户订单、生成学习计划、管理活动报名"></textarea>
                </label>
                <button class="button" type="button">提交功能待开发</button>
            </form>
        </section>
    </main>
</body>
</html>
